theme:
  name: material
  # logo: assets/logo.png
  # favicon: assets/logo.ico
  font: false
  custom_dir: docs/overrides
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # - pymdownx.highlight
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: true
      dedent_subsections: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eo-tools/eozilla
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/eozilla/
  footer_links:
    - text: Imprint
      href: https://www.brockmann-consult.de/imprint/
    - text: Privacy Policy
      href: https://www.brockmann-consult.de/privacy-policy/

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            #annotations_path: brief
            #annotations_path: full
            annotations_path: source
            docstring_style: google
            docstring_section_style: table
            filters:
              - "!^_"
            heading_level: 3
            inherited_members: true
            line_length: 80
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: false
            show_root_heading: true
            show_root_toc_entry: true
            show_signature_annotations: true
            show_source: false
            # --- Generates JSON schema doc for each pydantic model:
            # extensions:
            #  - griffe_pydantic:
            #      schema: true
extra_css:
  - stylesheets/custom.css

hooks:
  - docs/hooks/download_fonts.py