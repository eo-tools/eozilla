[workspace]
name = "cuiman-authlib-proof"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64"]

[dependencies]
python = "3.12.*"
authlib = "==1.8.0"
httpx2 = "==2.5.0"
ruff = "*"

[tasks]
proof = "python proof.py"
check = "ruff check proof.py"
format-check = "ruff format --check proof.py"
